<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storyboard Generator</title>
<style>
  :root {
    --bg: #0f0f10;
    --surface: #1a1a1d;
    --surface-2: #232327;
    --border: #2c2c31;
    --border-strong: #3a3a40;
    --text: #ececee;
    --text-dim: #9a9aa3;
    --text-soft: #6c6c75;
    --accent: #d4a373;
    --accent-soft: #3a2f24;
    --danger: #e06363;
    --ok: #7bb37b;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.5; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  textarea { resize: vertical; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { font-weight: 600; letter-spacing: 0.2px; }
  .brand-dot { color: var(--accent); }
  .topbar-spacer { flex: 1; }
  .icon-btn { padding: 8px 12px; border-radius: var(--radius-sm); color: var(--text-dim); border: 1px solid var(--border); background: var(--surface-2); transition: all .15s; }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .icon-btn.warn { color: var(--danger); border-color: rgba(224,99,99,0.3); }

  /* Stepper */
  .stepper { display: flex; gap: 6px; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .step { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius-sm); background: transparent; color: var(--text-soft); border: 1px solid transparent; white-space: nowrap; transition: all .15s; }
  .step:hover { color: var(--text-dim); background: var(--surface-2); }
  .step.active { color: var(--text); background: var(--accent-soft); border-color: rgba(212,163,115,0.3); }
  .step.done { color: var(--text-dim); }
  .step.disabled { opacity: 0.4; cursor: not-allowed; }
  .step-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .step.active .step-num { background: var(--accent); color: #1a1a1d; }
  .step.done .step-num { background: var(--ok); color: #1a1a1d; }
  .step-label { font-size: 13px; }

  /* Content */
  .main { padding: 32px 24px 80px; max-width: 920px; margin: 0 auto; width: 100%; }
  .step-header { margin-bottom: 24px; }
  .step-title { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .step-sub { color: var(--text-dim); margin: 0; }

  /* Form */
  .field { margin-bottom: 20px; }
  .field-label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .field-hint { color: var(--text-soft); font-size: 12px; margin-top: 4px; }
  .input, .textarea, .select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); outline: none; transition: border-color .15s; }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
  .textarea { min-height: 120px; font-family: inherit; }
  .textarea.lg { min-height: 240px; }

  /* Buttons */
  .btn { padding: 10px 18px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-weight: 500; transition: all .15s; }
  .btn:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: #1a1a1d; border-color: var(--accent); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
  .btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .btn.danger { color: var(--danger); border-color: rgba(224,99,99,0.3); }
  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-row.right { justify-content: flex-end; }
  .btn-row.between { justify-content: space-between; }

  /* Nav footer */
  .nav-footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 10; }
  .nav-footer-inner { max-width: 920px; width: 100%; margin: 0 auto; display: flex; justify-content: space-between; gap: 12px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .card + .card { margin-top: 12px; }

  /* Refs grid */
  .refs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
  .ref-thumb { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
  .ref-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref-thumb .remove { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: white; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; line-height: 1; }
  .ref-upload { aspect-ratio: 1; border: 2px dashed var(--border-strong); border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--text-dim); cursor: pointer; transition: all .15s; text-align: center; padding: 12px; }
  .ref-upload:hover { border-color: var(--accent); color: var(--accent); }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: grid; place-items: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 520px; box-shadow: var(--shadow); }
  .modal-title { font-size: 18px; font-weight: 600; margin: 0 0 18px; }

  /* Misc */
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-dim); font-size: 11px; }
  .pill.ok { color: var(--ok); background: rgba(123,179,123,0.1); }
  .pill.err { color: var(--danger); background: rgba(224,99,99,0.1); }
  .pill.warn { color: var(--accent); background: var(--accent-soft); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--text-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .row { display: flex; gap: 12px; align-items: center; }
  .grow { flex: 1; }
  .muted { color: var(--text-dim); }
  .soft { color: var(--text-soft); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  /* Scene cards */
  .scene { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .scene-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .scene-num { font-weight: 600; color: var(--accent); }
  .scene-actions { display: flex; gap: 6px; margin-left: auto; }
  .scene-img { width: 100%; border-radius: var(--radius-sm); margin-top: 10px; border: 1px solid var(--border); }
  .scene-img-empty { width: 100%; aspect-ratio: 16/9; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px dashed var(--border-strong); display: grid; place-items: center; color: var(--text-soft); margin-top: 10px; }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 18px; box-shadow: var(--shadow); z-index: 200; max-width: 90%; }
  .toast.err { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">Storyboard<span class="brand-dot">.</span></div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="btn-new-project" title="Novo projeto">+ Novo</button>
    <button class="icon-btn" id="btn-settings">Settings</button>
  </header>

  <!-- Stepper -->
  <nav class="stepper" id="stepper"></nav>

  <!-- Main content -->
  <main class="main" id="main"></main>

  <!-- Nav footer -->
  <div class="nav-footer">
    <div class="nav-footer-inner">
      <button class="btn ghost" id="btn-prev">← Voltar</button>
      <div class="muted" id="autosave-status"></div>
      <button class="btn primary" id="btn-next">Avançar →</button>
    </div>
  </div>
</div>

<!-- Modal mount -->
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';

// =====================================================================
// CONFIG
// =====================================================================
const STEPS = [
  { id: 1, key: 'roteiro',    label: 'Roteiro' },
  { id: 2, key: 'personagem', label: 'Personagem' },
  { id: 3, key: 'estetica',   label: 'Estética' },
  { id: 4, key: 'cenas',      label: 'Cenas' },
  { id: 5, key: 'prompts',    label: 'Prompts' },
  { id: 6, key: 'geracao',    label: 'Geração' },
  { id: 7, key: 'review',     label: 'Review' },
];

const DEFAULT_SETTINGS = {
  anthropicKey: '',
  googleKey: '',
  claudeModel: 'claude-sonnet-4-5-20250929',
  imageModel: 'imagen-3.0-generate-002',
  aspectRatio: '16:9',
};

const BROKEN_DEFAULTS = ['gemini-2.0-flash-exp', 'gemini-2.5-flash-image-preview'];

const CLAUDE_MODELS = [
  'claude-opus-4-5',
  'claude-sonnet-4-5-20250929',
  'claude-haiku-4-5-20251001',
];
const IMAGE_MODELS = [
  { id: 'imagen-3.0-generate-002',             label: 'Imagen 3 (texto-only, universal)' },
  { id: 'imagen-4.0-generate-001',             label: 'Imagen 4 (texto-only)' },
  { id: 'imagen-4.0-fast-generate-001',        label: 'Imagen 4 Fast (texto-only)' },
  { id: 'gemini-2.5-flash-image',              label: 'Gemini 2.5 Flash Image (aceita refs)' },
  { id: 'gemini-2.5-flash-image-preview',      label: 'Gemini 2.5 Flash Image Preview (aceita refs)' },
  { id: 'gemini-2.0-flash-exp',                label: 'Gemini 2.0 Flash Exp (aceita refs)' },
  { id: 'gemini-2.0-flash-preview-image-generation', label: 'Gemini 2.0 Flash Preview Image Gen (aceita refs)' },
];

const STORAGE_KEY = 'storyboard_v1';
const SETTINGS_KEY = 'storyboard_settings_v1';
const IDB_NAME = 'storyboard_db_v1';
const IDB_STORE = 'images';

// =====================================================================
// INDEXEDDB (large image blobs)
// =====================================================================
let _idbPromise = null;
function openIdb() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _idbPromise;
}
async function idbPut(record) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(record);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(id) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbClear() {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
function newImageId() { return 'img_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

// =====================================================================
// STATE
// =====================================================================
function emptyProject() {
  return {
    id: 'p_' + Date.now().toString(36),
    createdAt: new Date().toISOString(),
    step: 1,
    roteiro: '',
    personagem: { nome: '', descricao: '', refImg: null },
    estetica: { refs: [], styleBlock: '', analise: '' },
    cenas: [],
  };
}

let project  = loadProject()  || emptyProject();
let settings = loadSettings() || { ...DEFAULT_SETTINGS };

// =====================================================================
// PERSISTENCE
// =====================================================================
function projectForStorage() {
  const p = JSON.parse(JSON.stringify(project));
  for (const c of (p.cenas || [])) {
    if (c.imagens) {
      c.imagens = c.imagens.map(img => ({ id: img.id, generatedAt: img.generatedAt, prompt: img.prompt, mimeType: img.mimeType }));
    }
  }
  return p;
}

function saveProject() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projectForStorage()));
    flashAutosave();
  } catch (e) {
    toast('Erro ao salvar projeto: ' + e.message, true);
  }
}

async function hydrateProject() {
  for (const c of (project.cenas || [])) {
    if (!c.imagens) continue;
    for (const ref of c.imagens) {
      if (ref.id && !ref.dataUrl) {
        try {
          const rec = await idbGet(ref.id);
          if (rec) { ref.dataUrl = rec.dataUrl; ref.base64 = rec.base64; ref.mimeType = rec.mimeType; }
        } catch {}
      }
    }
  }
  renderMain();
}
function loadProject()  { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)  || 'null'); } catch { return null; } }
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) { console.warn(e); } }
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (s && BROKEN_DEFAULTS.includes(s.imageModel)) {
      s.imageModel = DEFAULT_SETTINGS.imageModel;
    }
    return s;
  } catch { return null; }
}

let autosaveTimer = null;
function flashAutosave() {
  const el = document.getElementById('autosave-status');
  if (!el) return;
  el.textContent = 'Salvo';
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => { el.textContent = ''; }, 1500);
}

// =====================================================================
// UTILS
// =====================================================================
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) node.setAttribute(k, '');
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const result = r.result;
      const comma = result.indexOf(',');
      resolve({ dataUrl: result, base64: result.slice(comma + 1), mimeType: file.type, name: file.name });
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function toast(msg, isErr = false) {
  const root = $('#toast-root');
  root.innerHTML = '';
  const t = el('div', { class: 'toast' + (isErr ? ' err' : '') }, msg);
  root.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, 3200);
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// =====================================================================
// API: ANTHROPIC
// =====================================================================
async function callClaude({ system, messages, maxTokens = 4096 }) {
  if (!settings.anthropicKey) throw new Error('Falta a chave da Anthropic em Settings');
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': settings.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: settings.claudeModel,
      max_tokens: maxTokens,
      system,
      messages,
    }),
  });
  if (!resp.ok) {
    const t = await resp.text();
    throw new Error('Claude ' + resp.status + ': ' + t.slice(0, 200));
  }
  const data = await resp.json();
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  return text;
}

function imgPart(img) {
  return { type: 'image', source: { type: 'base64', media_type: img.mimeType, data: img.base64 } };
}

// =====================================================================
// API: GOOGLE (Gemini Image / Imagen)
// =====================================================================
function rankImageModelName(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('imagen-4') && n.includes('ultra')) return 0;
  if (n.includes('imagen-4') && n.includes('fast')) return 2;
  if (n.includes('imagen-4')) return 1;
  if (n.includes('imagen-3') && !n.includes('fast')) return 3;
  if (n.includes('imagen-3')) return 4;
  if (n.includes('imagen')) return 5;
  if (n.includes('gemini') && n.includes('image') && n.includes('2.5') && !n.includes('preview')) return 6;
  if (n.includes('gemini') && n.includes('image') && n.includes('2.5')) return 7;
  if (n.includes('gemini') && n.includes('image')) return 8;
  if (n.includes('gemini') && n.includes('flash-exp')) return 9;
  return 99;
}

async function discoverBestImageModel() {
  if (!settings.googleKey) throw new Error('Falta chave Google');
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(settings.googleKey)}`);
  if (!resp.ok) throw new Error('ListModels ' + resp.status);
  const data = await resp.json();
  const ranked = (data.models || [])
    .filter(m => {
      const methods = m.supportedGenerationMethods || [];
      return methods.includes('generateContent') || methods.includes('predict');
    })
    .map(m => ({ id: (m.name || '').replace(/^models\//, ''), rank: rankImageModelName(m.name || '') }))
    .filter(m => m.rank < 99)
    .sort((a, b) => a.rank - b.rank);
  if (!ranked.length) throw new Error('Sua chave não tem nenhum modelo de imagem disponível');
  return ranked[0].id;
}

async function generateImage({ prompt, refImages = [] }) {
  if (!settings.googleKey) throw new Error('Falta a chave do Google AI em Settings');
  return await tryGenerateImage(prompt, refImages, false);
}

async function tryGenerateImage(prompt, refImages, isRetry) {
  const model = settings.imageModel;
  try {
    if (model.startsWith('gemini-')) return await generateImageGemini({ prompt, refImages, model });
    return await generateImageImagen({ prompt, model });
  } catch (e) {
    const msg = String(e.message || '');
    const is404 = /\b404\b|not found|not supported|not available/i.test(msg);
    if (is404 && !isRetry) {
      toast(`"${model}" indisponível — buscando alternativa...`);
      let next;
      try { next = await discoverBestImageModel(); }
      catch (e2) { throw new Error(e.message + ' | auto-discovery: ' + e2.message); }
      if (next && next !== model) {
        settings.imageModel = next;
        saveSettings();
        toast('Auto-selecionado: ' + next);
        return await tryGenerateImage(prompt, refImages, true);
      }
    }
    throw e;
  }
}

async function generateImageGemini({ prompt, refImages, model }) {
  const parts = [{ text: prompt }];
  for (const ref of refImages) {
    parts.push({ inline_data: { mime_type: ref.mimeType, data: ref.base64 } });
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(settings.googleKey)}`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts }],
      generationConfig: { responseModalities: ['IMAGE'] },
    }),
  });
  if (!resp.ok) throw new Error('Gemini ' + resp.status + ': ' + (await resp.text()).slice(0, 200));
  const data = await resp.json();
  const cand = data.candidates?.[0]?.content?.parts || [];
  const imgPart = cand.find(p => p.inlineData || p.inline_data);
  const inline = imgPart?.inlineData || imgPart?.inline_data;
  if (!inline) throw new Error('Gemini não retornou imagem');
  return { base64: inline.data, mimeType: inline.mimeType || inline.mime_type || 'image/png', dataUrl: 'data:' + (inline.mimeType || inline.mime_type || 'image/png') + ';base64,' + inline.data };
}

async function generateImageImagen({ prompt, model }) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:predict?key=${encodeURIComponent(settings.googleKey)}`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      instances: [{ prompt }],
      parameters: { sampleCount: 1, aspectRatio: settings.aspectRatio || '16:9' },
    }),
  });
  if (!resp.ok) throw new Error('Imagen ' + resp.status + ': ' + (await resp.text()).slice(0, 200));
  const data = await resp.json();
  const pred = data.predictions?.[0];
  const b64 = pred?.bytesBase64Encoded || pred?.image?.bytesBase64Encoded;
  if (!b64) throw new Error('Imagen não retornou imagem');
  return { base64: b64, mimeType: 'image/png', dataUrl: 'data:image/png;base64,' + b64 };
}

// =====================================================================
// RENDER: STEPPER + NAV
// =====================================================================
function renderStepper() {
  const stepper = $('#stepper');
  stepper.innerHTML = '';
  for (const s of STEPS) {
    const isActive = s.id === project.step;
    const isDone   = s.id < project.step;
    const cls = 'step' + (isActive ? ' active' : isDone ? ' done' : '');
    const btn = el('button', { class: cls, onclick: () => goToStep(s.id) },
      el('span', { class: 'step-num' }, String(s.id)),
      el('span', { class: 'step-label' }, s.label),
    );
    stepper.appendChild(btn);
  }
}

function goToStep(n) {
  if (n < 1 || n > STEPS.length) return;
  project.step = n;
  saveProject();
  renderAll();
}

function renderNavFooter() {
  $('#btn-prev').disabled = project.step <= 1;
  $('#btn-next').disabled = project.step >= STEPS.length || !canAdvance();
  $('#btn-next').textContent = project.step >= STEPS.length ? 'Concluído' : 'Avançar →';
}

function canAdvance() {
  switch (project.step) {
    case 1: return project.roteiro.trim().length > 20;
    case 2: return project.personagem.nome.trim() && project.personagem.descricao.trim();
    case 3: return project.estetica.styleBlock.trim().length > 30;
    case 4: return project.cenas.length > 0;
    case 5: return project.cenas.length > 0 && project.cenas.every(c => c.prompt && c.prompt.trim());
    case 6: return project.cenas.some(c => c.imagens && c.imagens.length > 0);
    default: return true;
  }
}

// =====================================================================
// RENDER: MAIN DISPATCHER
// =====================================================================
function renderMain() {
  const main = $('#main');
  main.innerHTML = '';
  const step = STEPS[project.step - 1];
  const renderer = STEP_RENDERERS[step.key];
  if (renderer) main.appendChild(renderer());
  else main.appendChild(el('div', {}, 'Step não implementado: ' + step.key));
}

function renderAll() {
  renderStepper();
  renderMain();
  renderNavFooter();
}

// ---------- STEP 6: GERAÇÃO ----------
async function generateImageForScene(i) {
  const c = project.cenas[i];
  if (!c.prompt) throw new Error('Cena sem prompt');
  c.status = 'generating';
  c.error = null;
  renderMain();
  try {
    const refs = [];
    if (settings.imageModel.startsWith('gemini-')) {
      if (project.personagem.refImg) refs.push(project.personagem.refImg);
      for (const r of project.estetica.refs) refs.push(r);
    }
    const img = await generateImage({ prompt: c.prompt, refImages: refs });
    const record = { id: newImageId(), ...img, generatedAt: new Date().toISOString(), prompt: c.prompt };
    await idbPut(record);
    c.imagens = c.imagens || [];
    c.imagens.push(record);
    c.currentImageIdx = c.imagens.length - 1;
    c.status = 'done';
    saveProject();
  } catch (e) {
    c.status = 'error';
    c.error = e.message;
    saveProject();
    throw e;
  }
}

  wrap.appendChild(el('div', { class: 'step-header' },
    el('h1', { class: 'step-title' }, '6. Geração de imagens'),
    el('p', { class: 'step-sub' }, 'Cada cena gera 1 imagem. O histórico de regerações fica salvo — clique nas miniaturas pra escolher qual versão usar.'),
  ));

  const refsUsed = [];
  if (project.personagem.refImg) refsUsed.push('personagem');
  if (project.estetica.refs.length) refsUsed.push(`${project.estetica.refs.length} de estética`);
  const refsInfo = settings.imageModel.startsWith('gemini-')
    ? (refsUsed.length ? `Enviando refs: ${refsUsed.join(' + ')}` : 'Sem refs (só texto)')
    : 'Modo texto-only (Imagen 3 não aceita refs visuais)';
  wrap.appendChild(el('div', { class: 'card', style: { marginBottom: '20px' } },
    el('div', { class: 'row' },
      el('span', { class: 'pill warn' }, settings.imageModel),
      el('span', { class: 'muted' }, refsInfo),
    ),
  ));

  const genAllBtn = el('button', { class: 'btn primary' }, '✨ Gerar todas as cenas');
  const genAllStatus = el('span', { class: 'muted' });
  genAllBtn.addEventListener('click', async () => {
    if (!confirm(`Gerar imagens pra ${project.cenas.length} cenas? Isso consome créditos.`)) return;
    genAllBtn.disabled = true;
    for (let i = 0; i < project.cenas.length; i++) {
      genAllStatus.innerHTML = `<span class="spin"></span> ${i+1}/${project.cenas.length}`;
      try { await generateImageForScene(i); }
      catch (e) { toast(`Cena ${i+1}: ${e.message}`, true); }
      renderMain();
    }
    genAllBtn.disabled = false;
    genAllStatus.textContent = '';
    renderNavFooter();
  });
  wrap.appendChild(el('div', { class: 'btn-row', style: { marginBottom: '20px' } }, genAllBtn, genAllStatus));

  for (let i = 0; i < project.cenas.length; i++) {
    const c = project.cenas[i];
    const scene = el('div', { class: 'scene' });

    const actionBtn = el('button', { class: 'btn sm' }, c.imagens && c.imagens.length > 0 ? '↻ Regerar' : 'Gerar');
    actionBtn.addEventListener('click', async () => {
      actionBtn.disabled = true;
      try { await generateImageForScene(i); }
      catch (e) { toast(e.message, true); }
      renderMain();
      renderNavFooter();
    });

    scene.appendChild(el('div', { class: 'scene-head' },
      el('span', { class: 'scene-num' }, `Cena ${i + 1}`),
      el('span', { class: 'pill' + (c.status === 'done' ? ' ok' : c.status === 'error' ? ' err' : '') }, c.status),
      el('div', { class: 'scene-actions' }, actionBtn),
    ));
    scene.appendChild(el('div', { class: 'soft', style: { fontSize: '13px', marginBottom: '6px' } }, c.textoRoteiro));

    if (c.status === 'generating') {
      scene.appendChild(el('div', { class: 'scene-img-empty' }, el('span', {}, el('span', { class: 'spin' }), ' gerando...')));
    } else if (c.imagens && c.imagens.length > 0) {
      const idx = c.currentImageIdx >= 0 ? c.currentImageIdx : c.imagens.length - 1;
      const img = c.imagens[idx];
      scene.appendChild(el('img', { class: 'scene-img', src: img.dataUrl }));
      if (c.imagens.length > 1) {
        const history = el('div', { class: 'btn-row', style: { marginTop: '8px', flexWrap: 'wrap' } });
        history.appendChild(el('span', { class: 'soft', style: { fontSize: '12px' } }, `${c.imagens.length} versões:`));
        for (let j = 0; j < c.imagens.length; j++) {
          const isCurrent = j === idx;
          const thumb = el('div', { class: 'ref-thumb', style: { width: '56px', height: '56px', cursor: 'pointer', border: isCurrent ? '2px solid var(--accent)' : '1px solid var(--border)' }, onclick: () => { c.currentImageIdx = j; saveProject(); renderMain(); } },
            el('img', { src: c.imagens[j].dataUrl }),
          );
          history.appendChild(thumb);
        }
        scene.appendChild(history);
      }
    } else if (c.status === 'error') {
      scene.appendChild(el('div', { class: 'scene-img-empty' }, '⚠ ' + (c.error || 'erro')));
    } else {
      scene.appendChild(el('div', { class: 'scene-img-empty' }, 'Sem imagem ainda'));
    }

    wrap.appendChild(scene);
  }

  return wrap;
};

// ---------- STEP 7: REVIEW ----------
function exportJson() {
  const data = JSON.stringify(project, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `storyboard-${project.id}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadCenaImage(c, i) {
  const idx = c.currentImageIdx >= 0 ? c.currentImageIdx : c.imagens.length - 1;
  const img = c.imagens[idx];
  if (!img) return;
  const a = document.createElement('a');
  a.href = img.dataUrl;
  a.download = `cena-${String(i + 1).padStart(2, '0')}.png`;
  a.click();
}

async function exportAllImages() {
  for (let i = 0; i < project.cenas.length; i++) {
    const c = project.cenas[i];
    if (c.imagens && c.imagens.length > 0) {
      downloadCenaImage(c, i);
      await new Promise(r => setTimeout(r, 250));
    }
  }
}

async function copyAllPrompts() {
  const text = project.cenas.map((c, i) => `--- Cena ${i + 1} (${c.enquadramento || ''}) ---\n${c.prompt || ''}`).join('\n\n');
  try { await navigator.clipboard.writeText(text); toast('Prompts copiados'); }
  catch { toast('Falhou ao copiar', true); }
}

STEP_RENDERERS.review = function () {
  const wrap = el('div');
  wrap.appendChild(el('div', { class: 'step-header' },
    el('h1', { class: 'step-title' }, '7. Review'),
    el('p', { class: 'step-sub' }, 'Resumo final. Baixe imagens, copie prompts ou exporte o projeto inteiro.'),
  ));

  wrap.appendChild(el('div', { class: 'card' },
    el('div', {}, el('strong', {}, 'Personagem: '), project.personagem.nome),
    el('div', { class: 'soft', style: { marginTop: '8px', whiteSpace: 'pre-wrap', fontSize: '13px' } }, project.personagem.descricao),
  ));

  wrap.appendChild(el('div', { class: 'card', style: { marginTop: '12px' } },
    el('div', {}, el('strong', {}, 'styleBlock')),
    el('div', { class: 'soft', style: { marginTop: '8px', whiteSpace: 'pre-wrap', fontSize: '13px' } }, project.estetica.styleBlock),
  ));

  wrap.appendChild(el('div', { class: 'btn-row', style: { marginTop: '20px', marginBottom: '20px' } },
    el('button', { class: 'btn', onclick: exportJson }, '⬇ Baixar projeto (JSON)'),
    el('button', { class: 'btn', onclick: exportAllImages }, '⬇ Baixar imagens'),
    el('button', { class: 'btn', onclick: copyAllPrompts }, '📋 Copiar prompts'),
  ));

  for (let i = 0; i < project.cenas.length; i++) {
    const c = project.cenas[i];
    const scene = el('div', { class: 'scene' });
    scene.appendChild(el('div', { class: 'scene-head' },
      el('span', { class: 'scene-num' }, `Cena ${i + 1}`),
      c.enquadramento ? el('span', { class: 'pill' }, c.enquadramento) : null,
      el('div', { class: 'scene-actions' },
        c.imagens && c.imagens.length > 0 ? el('button', { class: 'btn sm', onclick: () => downloadCenaImage(c, i) }, '⬇') : null,
      ),
    ));
    scene.appendChild(el('div', { class: 'soft', style: { fontSize: '13px', marginBottom: '8px' } }, c.textoRoteiro));
    if (c.imagens && c.imagens.length > 0) {
      const idx = c.currentImageIdx >= 0 ? c.currentImageIdx : c.imagens.length - 1;
      scene.appendChild(el('img', { class: 'scene-img', src: c.imagens[idx].dataUrl }));
    } else {
      scene.appendChild(el('div', { class: 'scene-img-empty' }, 'Sem imagem'));
    }
    wrap.appendChild(scene);
  }

  return wrap;
};

// =====================================================================
// SETTINGS MODAL
// =====================================================================
function openSettings() {
  const root = $('#modal-root');
  root.innerHTML = '';

  const akeyIn = el('input', { class: 'input', type: 'password', placeholder: 'sk-ant-...' });
  akeyIn.value = settings.anthropicKey;
  const gkeyIn = el('input', { class: 'input', type: 'password', placeholder: 'AIza...' });
  gkeyIn.value = settings.googleKey;

  const cmodelSel = el('select', { class: 'select' },
    ...CLAUDE_MODELS.map(m => el('option', { value: m, selected: m === settings.claudeModel }, m)),
  );

  const imodelList = el('datalist', { id: 'image-models-list' },
    ...IMAGE_MODELS.map(m => el('option', { value: m.id }, m.label)),
  );
  const imodelIn = el('input', { class: 'input', list: 'image-models-list', placeholder: 'ex: gemini-2.0-flash-exp' });
  imodelIn.value = settings.imageModel;

  const listBtn = el('button', { class: 'btn sm' }, '🔍 Listar modelos da minha chave');
  const listOut = el('div', { class: 'soft mono', style: { marginTop: '8px', maxHeight: '240px', overflow: 'auto', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', padding: '8px' } });

  async function fetchAndShowModels() {
    const key = gkeyIn.value.trim();
    if (!key) { listOut.textContent = 'Cola a chave do Google e clica em "Listar".'; return; }
    listBtn.disabled = true;
    listOut.textContent = 'consultando...';
    try {
      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
      if (!resp.ok) throw new Error(resp.status + ': ' + (await resp.text()).slice(0, 200));
      const data = await resp.json();
      const models = (data.models || []).filter(m => {
        const methods = m.supportedGenerationMethods || [];
        return methods.includes('generateContent') || methods.includes('predict');
      });

      function score(m) {
        const n = (m.name || '').toLowerCase();
        if (n.includes('imagen')) return 0;
        if (n.includes('image')) return 1;
        if (n.includes('flash')) return 2;
        if (n.includes('pro')) return 3;
        return 4;
      }
      models.sort((a, b) => score(a) - score(b));

      listOut.innerHTML = '';
      if (!models.length) {
        listOut.textContent = 'Nenhum modelo encontrado pra essa chave.';
        return;
      }
      for (const m of models) {
        const id = (m.name || '').replace(/^models\//, '');
        const methods = m.supportedGenerationMethods || [];
        const n = id.toLowerCase();
        let kind = '';
        if (n.includes('imagen')) kind = 'imagen (texto-only)';
        else if (n.includes('image')) kind = 'multimodal (aceita refs)';
        else if (methods.includes('predict')) kind = 'predict';
        else kind = 'texto';
        const isImage = n.includes('imagen') || n.includes('image');
        const row = el('div', {
          style: { cursor: 'pointer', padding: '5px 8px', borderRadius: '4px', display: 'flex', justifyContent: 'space-between', gap: '12px', color: isImage ? 'var(--accent)' : 'var(--text-dim)' },
          onclick: () => { imodelIn.value = id; toast('Selecionado: ' + id); },
        },
          el('span', {}, (isImage ? '★ ' : '  ') + id),
          el('span', { class: 'soft', style: { fontSize: '11px' } }, kind),
        );
        row.addEventListener('mouseenter', () => row.style.background = 'var(--surface-2)');
        row.addEventListener('mouseleave', () => row.style.background = '');
        listOut.appendChild(row);
      }
      // Header
      const header = el('div', { class: 'soft', style: { fontSize: '11px', marginBottom: '6px' } }, `${models.length} modelos. Clique para selecionar. ★ = gera imagem.`);
      listOut.insertBefore(header, listOut.firstChild);
    } catch (e) {
      listOut.textContent = 'erro: ' + e.message;
    } finally {
      listBtn.disabled = false;
    }
  }
  listBtn.addEventListener('click', fetchAndShowModels);
  // Auto-run on open if there's already a key
  if (settings.googleKey) setTimeout(fetchAndShowModels, 100);

  const arSel = el('select', { class: 'select' },
    ...['16:9','9:16','1:1','4:3','3:4'].map(a => el('option', { value: a, selected: a === settings.aspectRatio }, a)),
  );

  const modal = el('div', { class: 'modal' },
    el('h2', { class: 'modal-title' }, 'Settings'),
    el('div', { class: 'field' }, el('label', { class: 'field-label' }, 'Anthropic API key'), akeyIn),
    el('div', { class: 'field' }, el('label', { class: 'field-label' }, 'Google AI API key'), gkeyIn),
    el('div', { class: 'field' }, el('label', { class: 'field-label' }, 'Modelo Claude (análise de texto/imagem)'), cmodelSel),
    el('div', { class: 'field' },
      el('label', { class: 'field-label' }, 'Modelo de geração de imagem'),
      imodelIn, imodelList,
      el('div', { class: 'field-hint' }, 'Pode digitar qualquer ID que o Google aceitar. Modelos começando com "gemini-" suportam refs visuais; "imagen-" é texto-only.'),
      el('div', { class: 'btn-row', style: { marginTop: '8px' } }, listBtn),
      listOut,
    ),
    el('div', { class: 'field' }, el('label', { class: 'field-label' }, 'Aspect ratio (Imagen)'), arSel),
    el('div', { class: 'btn-row right' },
      el('button', { class: 'btn ghost', onclick: () => { root.innerHTML = ''; } }, 'Cancelar'),
      el('button', { class: 'btn primary', onclick: () => {
        settings.anthropicKey = akeyIn.value.trim();
        settings.googleKey    = gkeyIn.value.trim();
        settings.claudeModel  = cmodelSel.value;
        settings.imageModel   = imodelIn.value.trim();
        settings.aspectRatio  = arSel.value;
        saveSettings();
        root.innerHTML = '';
        toast('Settings salvos');
      } }, 'Salvar'),
    ),
  );

  const backdrop = el('div', { class: 'modal-backdrop', onclick: (e) => { if (e.target === backdrop) root.innerHTML = ''; } }, modal);
  root.appendChild(backdrop);
}

// =====================================================================
// INIT
// =====================================================================
function init() {
  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-new-project').addEventListener('click', async () => {
    if (!confirm('Descartar o projeto atual e começar um novo?')) return;
    try { await idbClear(); } catch {}
    project = emptyProject();
    saveProject();
    renderAll();
  });
  $('#btn-prev').addEventListener('click', () => goToStep(project.step - 1));
  $('#btn-next').addEventListener('click', () => goToStep(project.step + 1));
  renderAll();
  hydrateProject().catch(e => console.warn('hydrate failed', e));
}

document.addEventListener('DOMContentLoaded', init);
</script>
